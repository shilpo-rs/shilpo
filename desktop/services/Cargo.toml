[package]
name = "shilpo-services"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = []
ocr = ["dep:tesseract", "dep:leptonica-sys"]

[dependencies]
shilpo-domain.workspace = true
shilpo-device.workspace = true
shilpo-observability.workspace = true
gpui.workspace = true
niri-ipc.workspace = true
tokio = { workspace = true, features = ["sync"] }
zbus.workspace = true
zvariant.workspace = true
anyhow.workspace = true
thiserror = "2"
futures-lite.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
tracing-subscriber.workspace = true
dirs.workspace = true
smol.workspace = true
image.workspace = true
libc = "0.2"
arboard = { version = "3", features = ["wayland-data-control"] }
wayland-client = "0.31"
wayland-backend.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memfd = "0.6"
rustix = { version = "1", features = ["fs"] }
heed.workspace = true
schemars.workspace = true
tesseract = { version = "0.15", optional = true }
leptonica-sys = { version = "0.4", optional = true }
tokio-udev = { workspace = true }
notify.workspace = true
freedesktop-icons.workspace = true
libpulse-binding.workspace = true
ddc.workspace = true
ddc-i2c.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true
pam-sys = "1.0.0-alpha5"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
