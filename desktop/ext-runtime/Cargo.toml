[package]
name = "shilpo-ext-runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
sdk-fixture = []

[[example]]
name = "generate_script_manifest_schema"
path = "examples/generate_script_manifest_schema.rs"

[[bench]]
name = "wasm"
harness = false
required-features = ["sdk-fixture"]

[dependencies]
base64.workspace = true
flate2.workspace = true
futures-lite.workspace = true
hex.workspace = true
jsonschema.workspace = true
libc.workspace = true
reqwest.workspace = true
ring.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
url.workspace = true
shilpo-ext-api.workspace = true
shilpo-registry-contract.workspace = true
shilpo-observability.workspace = true
oo7.workspace = true
smol.workspace = true
uuid.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
tracing.workspace = true
heed.workspace = true
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser.workspace = true
wat.workspace = true

[dev-dependencies]
criterion = { workspace = true }
proptest.workspace = true
tempfile.workspace = true
# Re-declares the workspace dependency with test-util enabled, so the official-source
# test override is only ever compiled into test builds of this crate, never a normal
# (release) build — see core/registry-contract/Cargo.toml.
shilpo-registry-contract = { workspace = true, features = ["test-util"] }
